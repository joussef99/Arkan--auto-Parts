appId: com.arkan.autoparts.erp
productName: Arkan Auto Parts ERP
copyright: Copyright © 2026 Arkan Auto Parts

files:
  - electron/**
  - package.json
  - node_modules/**
  - "!**/*.map"
  - "!**/.cache/**"

extraResources:
  - from: backend/dist
    to: backend/dist
  - from: backend/package.json
    to: backend/package.json
  - from: backend/node_modules
    to: backend/node_modules
  - from: frontend/dist
    to: frontend/dist

directories:
  buildResources: build
  output: release

asar: true
asarUnpack:
  - node_modules/better-sqlite3/**

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
  legalTrademarks: Arkan Auto Parts ERP

portable:
  artifactName: Arkan-Auto-Parts-ERP-Portable-${version}.exe

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  artifactName: Arkan-Auto-Parts-ERP-Setup-${version}.exe
